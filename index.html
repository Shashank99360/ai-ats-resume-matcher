<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI ATS Resume Matcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold text-blue-400">AI ATS Resume Matcher & Optimizer</h1>
      <p class="text-slate-400 mt-2">Evaluate compatibility and upgrade your bullet points with zero formatting loss.</p>
    </header>

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-6">
      <div>
        <label class="block text-sm font-semibold mb-2 text-slate-300">1. Upload Resume (PDF only)</label>
        <input type="file" id="resume" accept=".pdf" class="w-full text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer" />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2 text-slate-300">2. Job Description (JD)</label>
        <textarea id="jd" rows="5" placeholder="Paste the target job description here..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-slate-100"></textarea>
      </div>

      <div class="flex flex-col sm:flex-row gap-4">
        <button id="analyzeBtn" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 font-bold rounded-xl transition shadow-lg">
          🔍 Analyze Match Score
        </button>
        <button id="improveBtn" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 font-bold rounded-xl transition shadow-lg">
          ✨ Enhance My Bullet Points
        </button>
      </div>
    </div>

    <!-- Results Section -->
    <div id="results" class="hidden mt-8 space-y-6">
      <div id="analysisCard" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
        <h2 class="text-xl font-bold text-blue-400">ATS Match Report</h2>
        <div class="flex items-center gap-4">
          <span class="text-4xl font-extrabold text-emerald-400" id="scoreText">0%</span>
          <span class="text-slate-400 text-sm">Keyword Compatibility Score</span>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div class="bg-slate-900 p-4 rounded-xl">
            <h3 class="font-bold text-emerald-400 mb-2">Matched Skills</h3>
            <ul id="matchedList" class="list-disc list-inside text-sm space-y-1 text-slate-300"></ul>
          </div>
          <div class="bg-slate-900 p-4 rounded-xl">
            <h3 class="font-bold text-red-400 mb-2">Missing Skills</h3>
            <ul id="missingList" class="list-disc list-inside text-sm space-y-1 text-slate-300"></ul>
          </div>
        </div>
      </div>

      <div id="bulletsCard" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
        <h2 class="text-xl font-bold text-emerald-400">Targeted Bullet Enhancements (Copy & Paste to your Resume)</h2>
        <div id="bulletsContainer" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <script>
    const resumeInput = document.getElementById("resume");
    const jdInput = document.getElementById("jd");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const improveBtn = document.getElementById("improveBtn");
    const resultsDiv = document.getElementById("results");

    function validate() {
      if (!resumeInput.files[0] || !jdInput.value.trim()) {
        alert("Please select a PDF resume and paste the Job Description.");
        return false;
      }
      return true;
    }

    analyzeBtn.addEventListener("click", async () => {
      if (!validate()) return;
      analyzeBtn.innerText = "Analyzing...";
      analyzeBtn.disabled = true;

      const fd = new FormData();
      fd.append("resume", resumeInput.files[0]);
      fd.append("job_description", jdInput.value);

      try {
        const res = await fetch("/analyze", { method: "POST", body: fd });
        const json = await res.json();
        const data = json.data;

        document.getElementById("scoreText").innerText = data.match_score + "%";
        document.getElementById("matchedList").innerHTML = data.matched_skills.map(s => `<li>${s}</li>`).join("");
        document.getElementById("missingList").innerHTML = data.missing_skills.map(s => `<li>${s}</li>`).join("");

        resultsDiv.classList.remove("hidden");
        document.getElementById("analysisCard").classList.remove("hidden");
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        analyzeBtn.innerText = "🔍 Analyze Match Score";
        analyzeBtn.disabled = false;
      }
    });

    improveBtn.addEventListener("click", async () => {
      if (!validate()) return;
      improveBtn.innerText = "Generating...";
      improveBtn.disabled = true;

      const fd = new FormData();
      fd.append("resume", resumeInput.files[0]);
      fd.append("job_description", jdInput.value);

      try {
        const res = await fetch("/improve-bullets", { method: "POST", body: fd });
        const json = await res.json();
        const bullets = json.data.improved_bullets;

        const container = document.getElementById("bulletsContainer");
        container.innerHTML = "";

        bullets.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = "p-4 bg-slate-900 rounded-xl border border-slate-700 space-y-2";
          card.innerHTML = `
            <p class="text-xs text-slate-500 uppercase tracking-wide">Original Bullet</p>
            <p class="text-sm text-slate-400 line-through">${item.original}</p>
            <p class="text-xs text-emerald-400 uppercase tracking-wide mt-2">ATS-Optimized Version</p>
            <div class="flex items-start justify-between gap-4">
              <p class="text-sm text-slate-100 font-medium">${item.improved}</p>
              <button onclick="navigator.clipboard.writeText('${item.improved.replace(/'/g, "\\'")}'); alert('Copied to clipboard!');" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded-md text-slate-200">Copy</button>
            </div>
            <p class="text-xs text-slate-400 italic">💡 Reason: ${item.reason}</p>
          `;
          container.appendChild(card);
        });

        resultsDiv.classList.remove("hidden");
        document.getElementById("bulletsCard").classList.remove("hidden");
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        improveBtn.innerText = "✨ Enhance My Bullet Points";
        improveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
